<!doctype html>
<!--
  Shown full-screen while the disconnected UI server is still starting.

  Must be entirely self-contained: this is an air-gapped machine, and the page
  is loaded over file://, so no webfonts, no images and no scripts.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Assisted Installer</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        background: #151515;
        color: #f0f0f0;
        font-family: 'Red Hat Text', 'Liberation Sans', 'DejaVu Sans', sans-serif;
        text-align: center;
      }
      h1 {
        font-size: 2rem;
        font-weight: 500;
        margin: 0;
      }
      p {
        margin: 0;
        font-size: 1.125rem;
        color: #b8bbbe;
      }
      .spinner {
        width: 3.5rem;
        height: 3.5rem;
        border: 4px solid #3c3f42;
        border-top-color: #1fa7f8;
        border-radius: 50%;
        animation: spin 1.1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div class="spinner" role="status" aria-label="Starting"></div>
    <h1>Assisted Installer</h1>
    <p>Waiting for the installation service to start&hellip;</p>
  </body>
</html>
